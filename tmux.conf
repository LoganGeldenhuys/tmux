# true color / terminfo
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"

# fix leaked escape sequences on startup (overrides tmux-sensible's escape-time 0)
set -sg escape-time 10

# use mouse
set -g mouse on

# Set prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Shift Alt cim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Vi copy mode
set-window-option -g mode-keys vi

# v = visual select, V = line select, C-v = block select (like vim)
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi V   send-keys -X select-line

# y to yank (copies to tmux buffer + system clipboard via OSC 52)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# Mouse drag copies without leaving copy mode
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe

# Paste from tmux buffer (P to avoid conflicting with prefix+p = previous-window)
bind P paste-buffer -p

# start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'

run '~/.config/tmux/plugins/tpm/tpm'

