# true color / terminfo
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"

# fix leaked escape sequences on startup (overrides tmux-sensible's escape-time 0)
set -sg escape-time 10

# use mouse
set -g mouse on

# Set prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Shift Alt cim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Vi copy mode
set-window-option -g mode-keys vi

# v = visual select, V = line select, C-v = block select (like vim)
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi V   send-keys -X select-line

# y to yank (copies to tmux buffer + system clipboard via OSC 52)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# Mouse drag copies without leaving copy mode
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe

# Paste from tmux buffer (P to avoid conflicting with prefix+p = previous-window)
bind P paste-buffer -p

# start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# main-vertical: equal left/right halves (default 80 makes left wider)
set -g main-pane-width 50%

# --- claude panes ---------------------------------------------------------

# M-a : new claude pane in current dir (chain-aware, overflows past 4)
bind -n M-a run-shell "~/.config/tmux/scripts/claude-pane.sh"

# M-s : new shell pane in current dir (same tiling logic, no claude)
bind -n M-s run-shell "~/.config/tmux/scripts/claude-pane.sh -C ''"

# M-S : fzf branch picker (enter:shell  alt-a:claude  ctrl-x:del)
bind -n M-S display-popup -E -h 70% -w 70% "~/.config/tmux/scripts/branch-picker.sh"

# M-D : fzf directory picker (enter:shell  alt-a:claude  alt-h:up  alt-l:into)
bind -n M-D display-popup -E -h 70% -w 70% "~/.config/tmux/scripts/dir-picker.sh"

# M-] : pop current pane from chain into its own window
# M-[ : pull current window into the chain
bind -n M-] run-shell "~/.config/tmux/scripts/chain-pop.sh"
bind -n M-[ run-shell "~/.config/tmux/scripts/chain-pull.sh"

# prefix + ! @ # $ : promote current pane to slot 1/2/3/4
bind '!' swap-pane -t 1
bind '@' swap-pane -t 2
bind '#' swap-pane -t 3
bind '$' swap-pane -t 4

# Re-apply layout when panes change in a managed window. Uses flock + stored
# layout name to prevent infinite loops from select-layout re-firing the hook.
set-hook -g window-layout-changed "run-shell '~/.config/tmux/scripts/relayout.sh #{hook_window}'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'janoamaral/tokyo-night-tmux'
set -g @plugin 'alexwforsythe/tmux-which-key'

run '~/.config/tmux/plugins/tpm/tpm'

